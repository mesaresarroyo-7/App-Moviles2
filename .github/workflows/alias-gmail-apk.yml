name: Build Alias Gmail Android APK

on:
  push:
    branches:
      - alias-gmail-react-native-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct verified project ZIP
        shell: bash
        run: |
          cat .ci/alias-gmail/chunk-* > project.b64
          base64 -d project.b64 > alias-gmail-react-native-verified.zip
          echo "eeeb6a29ab904c8afa7a992c83f731eecc7bf7d0d883ae6dbda03463f7c78fb9  alias-gmail-react-native-verified.zip" | sha256sum -c -
          unzip -t alias-gmail-react-native-verified.zip

      - name: Extract React Native project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q alias-gmail-react-native-verified.zip -d buildsrc
          test -f buildsrc/AliasGmail-ReactNative-Verified/package.json

      - name: Install dependencies
        working-directory: buildsrc/AliasGmail-ReactNative-Verified
        run: npm install --no-audit --no-fund

      - name: Expo dependency diagnostics
        working-directory: buildsrc/AliasGmail-ReactNative-Verified
        run: npx expo-doctor

      - name: TypeScript check
        working-directory: buildsrc/AliasGmail-ReactNative-Verified
        run: npx tsc --noEmit

      - name: Alias logic tests
        working-directory: buildsrc/AliasGmail-ReactNative-Verified
        run: npx --yes tsx scripts/test-alias.ts

      - name: Generate Android project
        working-directory: buildsrc/AliasGmail-ReactNative-Verified
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build signed debug APK
        working-directory: buildsrc/AliasGmail-ReactNative-Verified/android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find buildsrc/AliasGmail-ReactNative-Verified/android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK ZIP
        run: unzip -t "${{ steps.apk.outputs.path }}"

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.apk.outputs.path }}"

      - name: Verify APK alignment
        shell: bash
        run: |
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -P 16 -v 4 "${{ steps.apk.outputs.path }}"

      - name: Inspect Android package
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "${{ steps.apk.outputs.path }}" | head -n 25

      - name: SHA-256
        run: sha256sum "${{ steps.apk.outputs.path }}"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: AliasGmail-S26Ultra-APK
          path: "${{ steps.apk.outputs.path }}"
          if-no-files-found: error
          retention-days: 14
