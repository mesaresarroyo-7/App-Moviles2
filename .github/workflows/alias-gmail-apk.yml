name: Build Alias Gmail Android Release APK

on:
  push:
    branches:
      - alias-gmail-react-native-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct verified project ZIP
        shell: bash
        run: |
          cat .ci/alias-gmail/chunk-* > project.b64
          base64 -d project.b64 > alias-gmail-react-native-verified.zip
          echo "eeeb6a29ab904c8afa7a992c83f731eecc7bf7d0d883ae6dbda03463f7c78fb9  alias-gmail-react-native-verified.zip" | sha256sum -c -
          unzip -t alias-gmail-react-native-verified.zip

      - name: Extract React Native project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q alias-gmail-react-native-verified.zip -d buildsrc
          test -f buildsrc/AliasGmail-ReactNative-Verified/package.json

      - name: Install dependencies
        working-directory: buildsrc/AliasGmail-ReactNative-Verified
        run: npm install --no-audit --no-fund

      - name: Expo dependency diagnostics
        working-directory: buildsrc/AliasGmail-ReactNative-Verified
        run: npx expo-doctor

      - name: TypeScript check
        working-directory: buildsrc/AliasGmail-ReactNative-Verified
        run: |
          npm install --no-audit --no-fund --save-dev @types/node@24
          node -e 'const fs=require("fs"); const p="tsconfig.json"; const j=JSON.parse(fs.readFileSync(p,"utf8")); j.compilerOptions={...(j.compilerOptions||{}),types:["node"]}; fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n");'
          npx tsc --noEmit

      - name: Alias logic tests
        working-directory: buildsrc/AliasGmail-ReactNative-Verified
        run: npx --yes tsx scripts/test-alias.ts

      - name: Generate Android project
        working-directory: buildsrc/AliasGmail-ReactNative-Verified
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK with embedded JS bundle
        working-directory: buildsrc/AliasGmail-ReactNative-Verified/android
        env:
          CI: "1"
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate and sign release APK if needed
        id: apk
        shell: bash
        run: |
          BUILDDIR="buildsrc/AliasGmail-ReactNative-Verified/android/app/build/outputs/apk/release"
          APK="$(find "$BUILDDIR" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          FINAL="$RUNNER_TEMP/AliasGmail-S26Ultra-release.apk"

          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            cp "$APK" "$FINAL"
          else
            ALIGNED="$RUNNER_TEMP/AliasGmail-S26Ultra-release-aligned.apk"
            "$ZIPALIGN" -p -f 4 "$APK" "$ALIGNED"
            "$APKSIGNER" sign               --ks buildsrc/AliasGmail-ReactNative-Verified/android/app/debug.keystore               --ks-key-alias androiddebugkey               --ks-pass pass:android               --key-pass pass:android               --out "$FINAL"               "$ALIGNED"
          fi

          test -s "$FINAL"
          echo "path=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Verify JavaScript bundle is embedded
        shell: bash
        run: |
          unzip -l "${{ steps.apk.outputs.path }}" | tee "$RUNNER_TEMP/apk-files.txt"
          grep -Eq 'assets/index\.android\.bundle|assets/.*\.bundle' "$RUNNER_TEMP/apk-files.txt"

      - name: Verify APK ZIP integrity
        run: unzip -t "${{ steps.apk.outputs.path }}"

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.apk.outputs.path }}"

      - name: Verify APK alignment
        shell: bash
        run: |
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -P 16 -v 4 "${{ steps.apk.outputs.path }}"

      - name: Inspect package metadata
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "${{ steps.apk.outputs.path }}" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.aliasgmail.rn2026'" "$RUNNER_TEMP/badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/badging.txt"

      - name: Confirm release is not debuggable
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if "$AAPT" dump xmltree "${{ steps.apk.outputs.path }}" AndroidManifest.xml | grep -q "android:debuggable.*0xffffffff"; then
            echo "APK is debuggable; refusing release artifact"
            exit 1
          fi

      - name: SHA-256
        run: sha256sum "${{ steps.apk.outputs.path }}"

      - name: Upload verified standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: AliasGmail-S26Ultra-Release
          path: "${{ steps.apk.outputs.path }}"
          if-no-files-found: error
          retention-days: 14
